# OpenTelemetry Collector：统一接收日志/指标/追踪（§25）
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: {}
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
  resource:
    attributes:
      - { key: service.namespace, value: astralpath, action: upsert }
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  otlphttp/traces:
    endpoint: http://tempo.observability.svc:4318
  debug: { verbosity: normal }
service:
  pipelines:
    metrics: { receivers: [otlp], processors: [memory_limiter, batch, resource], exporters: [prometheus] }
    traces:  { receivers: [otlp], processors: [memory_limiter, batch, resource], exporters: [otlphttp/traces] }
