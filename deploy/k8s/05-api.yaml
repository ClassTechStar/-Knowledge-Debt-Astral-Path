---
# 单体演示台（AstralPath.Api）：包含 UI、主链路与全部扩展服务路由（本地/演示形态）
# 生产推荐按 20-*.yaml 拆分部署；本 Deployment 用于一体化演示与回归对照。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astralpath-api
  namespace: astralpath
spec:
  replicas: 2
  selector:
    matchLabels: { app: astralpath-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: astralpath-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: astralpath-api
          image: ghcr.io/classtechstar/astralpath/astralpath-api:1.3.0
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: ASPNETCORE_URLS
              value: "http://0.0.0.0:8080"
            - name: Persistence__Mode
              valueFrom: { configMapKeyRef: { name: astralpath-config, key: Persistence__Mode } }
            - name: OpenTelemetry__OtlpEndpoint
              valueFrom: { configMapKeyRef: { name: astralpath-config, key: OTLP_ENDPOINT } }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: astralpath-api
  namespace: astralpath
spec:
  type: ClusterIP
  selector: { app: astralpath-api }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
