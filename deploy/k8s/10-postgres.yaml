---
# PostgreSQL + pgvector：生产级持久化底座（§20 / §45.4）
# 说明：十个服务各自独立 Database（同一实例内分库），库名见 astralpath-db Secret。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: astralpath
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        prometheus.io/scrape: "false"
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: astralpath
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: astralpath-db
                  key: pg-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "2", memory: 2Gi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "astralpath"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: astralpath
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
