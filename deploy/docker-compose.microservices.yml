# 知债：星穹学途 · 十个扩展服务独立容器编排（§19.11）
# 仓库根目录执行：
#   docker compose -f deploy/docker-compose.microservices.yml up -d --build
# 契约与单体模式一致；服务间松耦合，只经 HTTP + 共享契约调用。
name: astralpath-micro

x-svc: &svc
  restart: unless-stopped
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://0.0.0.0:8080
    ASTRALPATH_Persistence__Mode: memory   # 生产改为 postgres
    ASTRALPATH_ConnectionStrings__Default: ${ASTRALPATH_PG:-}
    ASTRALPATH_OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
    interval: 15s
    timeout: 3s
    retries: 5
    start_period: 25s

services:
  concept-diffusion-svc:
    <<: *svc
    build:
      context: ..
      dockerfile: services/Dockerfile.service
      args: { SERVICE: concept-diffusion-svc }
    image: astralpath/concept-diffusion-svc:1.3.0
    container_name: astralpath-concept-diffusion
    ports: ["8081:8080"]

  exam-impact-svc:
    <<: *svc
    build:
      context: ..
      dockerfile: services/Dockerfile.service
      args: { SERVICE: exam-impact-svc }
    image: astralpath/exam-impact-svc:1.3.0
    container_name: astralpath-exam-impact
    ports: ["8082:8080"]

